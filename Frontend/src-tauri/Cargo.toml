[package]
name = "pico"
version = "0.1.0"
edition = "2021"
description = "Pico — voice-first AI companion for Windows (island + PTT + dictation + circle-to-ask)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Dependency set follows coucou-windows-latest/windows/src-tauri/Cargo.toml —
# proven on this machine for Tauri 2 on Windows.
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
# WS client to the Python sidecar: plain ws://127.0.0.1, no TLS on loopback.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
# StreamExt/SinkExt for the WebSocket split.
futures-util = { version = "0.3", features = ["sink"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager (DPAPI) for API keys — same as coucou.
keyring = { version = "3", features = ["windows-native"] }
# Win32 bits for the island: cursor poll, WS_EX_NOACTIVATE.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
